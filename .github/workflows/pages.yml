name: Publicar Brown-IA Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Injetar configuração pública da Brown
        env:
          BROWN_UNIVERSAL_KEY: ${{ secrets.BROWN_UNIVERSAL_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          key = os.environ.get('BROWN_UNIVERSAL_KEY', '')
          with open('config.js', 'w', encoding='utf-8') as f:
              f.write('window.BROWN_CONFIG = { universalKey: ' + json.dumps(key) + ' };\n')
          PY
      - name: Preparar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
